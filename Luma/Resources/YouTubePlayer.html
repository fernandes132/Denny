<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#player{width:100%;height:100%;min-height:200px}</style>
</head>
<body>
  <div id="player"></div>
  <script>
    var player;
    function report(event, code) {
      if (window.webkit && window.webkit.messageHandlers.lumaPlayer) {
        window.webkit.messageHandlers.lumaPlayer.postMessage({event:event,code:code||0});
      }
    }
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width:'100%', height:'100%', host:'https://www.youtube-nocookie.com',
        videoId:'__VIDEO_ID__',
        playerVars:{playsinline:1,autoplay:0,controls:1,origin:'__ORIGIN__'},
        events:{onReady:function(){report('ready');},onError:function(e){report('error',e.data);}}
      });
    }
  </script>
  <script src="https://www.youtube.com/iframe_api" onerror="report('error',0)"></script>
</body>
</html>
